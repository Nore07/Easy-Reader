[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quietreader"
version = "0.1.5"
description = "安静、离线优先的 Windows 本地阅读器"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<6.13", "charset-normalizer>=3.4,<4", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
quietreader = "quietreader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
